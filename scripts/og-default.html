<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=Lora:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;background:#11024d;font-family:'Jost',sans-serif}
  .photo{position:absolute;inset:0;background-image:url('file:///Users/eyoel/vibecoding/helper/Nucleus/website/public/images/stock/gallery-campus.webp');background-size:cover;background-position:78% 52%;background-repeat:no-repeat}
  .wash{position:absolute;inset:0;background:linear-gradient(100deg,rgba(17,2,77,.96) 0%,rgba(17,2,77,.90) 44%,rgba(17,2,77,.50) 80%,rgba(17,2,77,.34) 100%)}
  .wash2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,2,77,.78) 0%,rgba(17,2,77,.20) 26%,rgba(17,2,77,0) 40%)}
  .content{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{height:104px;width:auto;align-self:flex-start;flex:0 0 auto}
  h1{color:#fff;font-size:60px;line-height:1.08;font-weight:700;letter-spacing:-.5px;max-width:760px}
  h1 em{font-style:normal;color:#E0A93B}
  p{color:#d9e6f5;font-size:27px;line-height:1.4;margin-top:20px;max-width:700px;font-family:'Lora',serif}
  .rule{width:96px;height:5px;background:#E0A93B;border-radius:3px;margin-top:34px}
  .foot{display:flex;align-items:center;gap:16px;color:#d9e6f5;font-size:23px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .dot{width:7px;height:7px;border-radius:50%;background:#E0A93B}
</style></head><body>
<div class="card">
  <div class="photo"></div><div class="wash"></div><div class="wash2"></div>
  <div class="content">
    <img class="logo" src="file:///Users/eyoel/vibecoding/helper/Nucleus/website/public/images/nucleus-logo-white.webp">
    <div>
      <h1>International Cambridge<br>Curriculum in <em>Addis Ababa</em></h1>
      <p>Think Deeply. Create Boldly. Solve Truly.</p>
      <div class="rule"></div>
    </div>
    <div class="foot">Vatican, Addis Ababa <span class="dot"></span> Age 2 to Grade 8</div>
  </div>
</div></body></html>
